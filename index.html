<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Snoopy · Libro para Vany</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 50% 25%, #3d2b24 0%, #241916 55%, #140e0d 100%);
    color: #f3f4f6;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px));
    overflow: hidden;
    user-select: none;
  }

  /* Barra superior de navegación del libro */
  #bookNav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: min(95vw, 660px);
    background: rgba(28, 19, 17, 0.78);
    border: 1px solid rgba(252, 211, 77, 0.25);
    border-radius: 999px;
    padding: 5px 8px;
    margin-bottom: 5px;
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    z-index: 10;
  }
  .nav-group {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .nav-btn {
    font: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(252, 211, 77, 0.22);
    color: #fef3c7;
    border-radius: 999px;
    padding: 5px 11px;
    cursor: pointer;
    transition: transform 0.14s, background 0.14s, opacity 0.14s;
    white-space: nowrap;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(252, 211, 77, 0.22); }
  .nav-btn:active:not(:disabled) { transform: scale(0.95); }
  .nav-btn:disabled { opacity: 0.32; cursor: not-allowed; }
  .nav-btn.cover-btn {
    background: rgba(185, 28, 28, 0.35);
    border-color: rgba(252, 211, 77, 0.35);
  }

  #pageInfo {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-width: 0;
    flex: 1;
  }
  #pageNum {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #fcd34d;
    font-weight: 700;
  }
  #pageTitle {
    font-size: 0.8rem;
    color: #fffbeb;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 42vw;
  }

  /* Indicador de fase y barra de progreso */
  #statusHeader {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    transition: opacity 0.25s;
  }
  #cap {
    font-size: 0.74rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fcd34d;
    margin: 0 0 4px;
    text-align: center;
    font-weight: 600;
  }
  #bar {
    width: min(92vw, 560px);
    height: 4px;
    background: rgba(255, 255, 255, 0.16);
    border-radius: 9px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  #bar i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #f43f5e, #facc15);
    transition: width 0.12s linear;
  }

  /* Escenario 3D del libro físico */
  #wrap {
    flex: 1;
    width: 100%;
    max-width: 840px;
    min-height: 0;
    margin-bottom: 6px;
    position: relative;
    perspective: 1800px;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* Paneles inferiores de control */
  .panel {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    width: 100%;
    max-width: 680px;
    animation: fadeIn 0.28s ease;
    z-index: 10;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: none; }
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    align-items: center;
  }

  .big-btn {
    font: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    border: 0;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .big-btn:active { transform: scale(0.96); }
  .btn-open {
    background: linear-gradient(135deg, #fde047, #f59e0b);
    color: #27150c;
    box-shadow: 0 6px 22px rgba(245, 158, 11, 0.45);
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 11px 26px;
    font-size: 0.98rem;
  }
  .btn-user {
    background: linear-gradient(135deg, #fb7185, #f43f5e);
    color: #fff;
    box-shadow: 0 4px 16px rgba(244, 63, 94, 0.4);
  }
  .btn-auto {
    background: #fcd34d;
    color: #1f2937;
    box-shadow: 0 4px 16px rgba(252, 211, 77, 0.35);
  }
  .btn-skip {
    background: rgba(255, 255, 255, 0.14);
    color: #fde68a;
    border: 1px solid rgba(252, 211, 77, 0.4);
    padding: 7px 18px;
    font-size: 0.82rem;
    backdrop-filter: blur(6px);
  }
  .btn-skip:hover { background: rgba(255, 255, 255, 0.24); }

  /* Selector de tipos de pincel */
  #brushes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    background: rgba(255, 255, 255, 0.09);
    padding: 4px 7px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .br-btn {
    font: inherit;
    font-size: 0.72rem;
    font-weight: 500;
    background: transparent;
    border: 1px solid transparent;
    color: #e5e7eb;
    border-radius: 999px;
    padding: 4px 9px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .br-btn:hover { background: rgba(255, 255, 255, 0.12); }
  .br-btn.act {
    background: #fcd34d;
    color: #1f2937;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(252, 211, 77, 0.35);
  }

  /* Paleta de colores */
  #pal {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.1);
    padding: 5px 10px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  .sw {
    width: 23px;
    height: 23px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.4);
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    padding: 0;
  }
  .sw.act {
    transform: scale(1.22);
    border-color: #fff;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.65);
  }

  /* Tamaños de trazo y botones de acción */
  .sz {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    border: 1.5px solid transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
  }
  .sz span {
    background: #f3f4f6;
    border-radius: 50%;
    display: block;
  }
  .sz.act {
    border-color: #fcd34d;
    background: rgba(255, 255, 255, 0.25);
  }

  button.btn {
    font: inherit;
    font-size: 0.76rem;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    padding: 5px 11px;
    color: #f3f4f6;
    cursor: pointer;
    font-weight: 500;
    transition: transform 0.14s, background 0.14s;
  }
  button.btn:hover { background: rgba(255, 255, 255, 0.24); }
  button.btn:active { transform: scale(0.96); }
  button.pri {
    background: #fcd34d;
    color: #1f2937;
    border: 0;
    font-weight: 600;
  }

  /* Partículas flotantes de celebración */
  .h {
    position: fixed;
    bottom: -30px;
    font-size: 24px;
    pointer-events: none;
    animation: up 4s ease-in forwards;
    z-index: 50;
  }
  @keyframes up {
    to { transform: translateY(-105vh) rotate(20deg); opacity: 0; }
  }

  button:focus-visible { outline: 2px solid #fcd34d; outline-offset: 2px; }
  @media (hover: hover) { button.btn:hover, .nav-btn:hover, .big-btn:hover { filter: brightness(1.12); } }
  @media (min-width: 1100px) { #wrap { max-width: 960px; } }
  @media (pointer: coarse) {
    html, body { touch-action: manipulation; -webkit-touch-callout: none; }
    .nav-btn, .br-btn, button.btn { min-height: 40px; }
    .big-btn { min-height: 48px; }
    .sw { width: 28px; height: 28px; }
    #pal { gap: 7px; }
  }
  @media (max-height: 520px) and (orientation: landscape) { .big-btn { min-height: 38px; padding-top: 6px; padding-bottom: 6px; } }
  @media (max-width: 520px) {
    .nav-btn { font-size: 0.7rem; padding: 4px 9px; }
    .br-btn { font-size: 0.68rem; padding: 3px 7px; }
    .sw { width: 21px; height: 21px; }
    button.btn { font-size: 0.72rem; padding: 5px 9px; }
  }
</style>
</head>
<body>

<!-- Navegador superior del libro -->
<nav id="bookNav" aria-label="Navegación del libro">
  <div class="nav-group">
    <button class="nav-btn cover-btn" id="goCover" title="Volver a la portada">📕 Portada</button>
    <button class="nav-btn" id="prevPage" title="Página anterior">◀</button>
  </div>
  <div id="pageInfo">
    <span id="pageNum">Portada</span>
    <span id="pageTitle">Edición Especial para Vany</span>
  </div>
  <div class="nav-group">
    <button class="nav-btn" id="soundToggle" title="Sonido de hoja">🔊</button>
    <button class="nav-btn" id="nextPage" title="Página siguiente">Siguiente ▶</button>
  </div>
</nav>

<div id="statusHeader">
  <div id="cap">✨ Toca el libro para abrirlo</div>
  <div id="bar"><i id="bi"></i></div>
</div>

<div id="wrap"><canvas id="cv"></canvas></div>

<!-- Controles de Portada -->
<div id="coverControls" class="panel" style="display:flex;">
  <button class="big-btn btn-open" id="openBookBtn">📖 Abrir libro de Snoopy</button>
</div>

<!-- Controles durante animaciones (Saltar) -->
<div id="animControls" class="panel">
  <button class="big-btn btn-skip" id="skipAnim">⏭ Saltar animación</button>
</div>

<!-- Elección al terminar el entintado -->
<div id="choice" class="panel">
  <div class="row" style="gap: 12px;">
    <button class="big-btn btn-user" id="chooseUser">🎨 Lo pinto yo</button>
    <button class="big-btn btn-auto" id="chooseAuto">✨ Píntalo solo</button>
  </div>
</div>

<!-- Herramientas de pintura manual -->
<div id="tools" class="panel">
  <div id="brushes">
    <button class="br-btn act" data-tool="brush" title="Acuarela suave">🖌️ Pincel</button>
    <button class="br-btn" data-tool="crayon" title="Crayola con textura">🖍️ Crayola</button>
    <button class="br-btn" data-tool="chalk" title="Gis / Tiza pastel">🪨 Gis</button>
    <button class="br-btn" data-tool="ink" title="Tinta / Marcador sólido">🖋️ Tinta</button>
    <button class="br-btn" data-tool="pencil" title="Lápiz de color">✏️ Lápiz</button>
    <button class="br-btn" data-tool="eraser" title="Borrador">🧽 Borrador</button>
  </div>

  <div id="pal"></div>

  <div class="row">
    <button class="sz" data-r="3" title="Trazo fino"><span style="width:5px;height:5px"></span></button>
    <button class="sz act" data-r="7" title="Trazo medio"><span style="width:10px;height:10px"></span></button>
    <button class="sz" data-r="14" title="Trazo grueso"><span style="width:16px;height:16px"></span></button>
    <button class="btn" id="undo">↩ Deshacer</button>
    <button class="btn" id="clear">🧹 Limpiar</button>
    <button class="btn" id="switchAuto">✨ Píntalo solo</button>
    <button class="btn" id="replay1">🔄 Redibujar</button>
    <button class="btn pri" id="save">💾 Guardar</button>
  </div>
</div>

<!-- Controles cuando termina el autocoloreado -->
<div id="autoControls" class="panel">
  <div class="row">
    <button class="btn" id="switchUser">🎨 Quiero pintarlo yo</button>
    <button class="btn" id="replay2">🔄 Ver de nuevo</button>
    <button class="btn pri" id="saveAuto">💾 Guardar</button>
  </div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const W = 200, H = 150;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// SVG oculto para medir longitudes y calcular puntos exactos de trazo
const svg = document.createElementNS(NS, 'svg');
svg.style.cssText = 'position:absolute;width:0;height:0;visibility:hidden';
document.body.appendChild(svg);

const P = d => {
  const e = document.createElementNS(NS, 'path');
  e.setAttribute('d', d);
  svg.appendChild(e);
  return { e, p: new Path2D(d), len: e.getTotalLength() || 1 };
};
const cl = x => Math.max(0, Math.min(1, x));
const circ = (x, y, r) => `M${x - r} ${y} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0Z`;
const star = (x, y, R) => {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2;
    const q = i % 2 ? R * 0.45 : R;
    d += (i ? 'L' : 'M') + (x + Math.cos(a) * q).toFixed(1) + ' ' + (y + Math.sin(a) * q).toFixed(1);
  }
  return d + 'Z';
};
const heart = (cx, cy, s) =>
  `M${cx} ${cy} C${cx} ${cy - 6 * s} ${cx - 8 * s} ${cy - 8 * s} ${cx - 8 * s} ${cy - 2 * s} ` +
  `C${cx - 8 * s} ${cy + 4 * s} ${cx} ${cy + 8 * s} ${cx} ${cy + 12 * s} ` +
  `C${cx} ${cy + 8 * s} ${cx + 8 * s} ${cy + 4 * s} ${cx + 8 * s} ${cy - 2 * s} ` +
  `C${cx + 8 * s} ${cy - 8 * s} ${cx} ${cy - 6 * s} ${cx} ${cy}Z`;

const K = '#111827';

// ============================================================================
// EFECTO DE SONIDO PROCEDURAL DE PASO DE HOJA (WEB AUDIO API)
// ============================================================================
let soundEnabled = true;
let audioCtx = null;

function playPageFlipSound() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const dur = 0.36;
    const bufferSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      const t = i / bufferSize;
      // Envolvente suave tipo roce de papel
      const env = Math.sin(Math.PI * t) * Math.pow(1 - t, 0.7);
      data[i] = (Math.random() * 2 - 1) * env * 0.35;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(650, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(1900, audioCtx.currentTime + dur * 0.6);
    filter.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + dur);
    filter.Q.value = 1.4;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.32, audioCtx.currentTime + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  } catch (err) {
    // Ignorar si el navegador bloquea audio sin interacción previa
  }
}

document.getElementById('soundToggle').onclick = () => {
  soundEnabled = !soundEnabled;
  document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
};

// ============================================================================
// DEFINICIÓN DE LAS 10 PÁGINAS ILUSTRADAS DEL LIBRO
// ============================================================================

// --- PÁGINA 1: Snoopy Navideño ---
const P1 = (() => {
  const ROOF = 'M36 76 L100 36 L164 76 Z', BODY = 'M50 76 V136 H150 V76 Z',
        DOOR = 'M82 136 V118 C82 100 118 100 118 118 V136 Z',
        GROUND = 'M0 136 C40 128 80 140 120 134 C160 128 180 136 200 132';
  const SB = 'M88 30 C90 20 120 18 134 25 C143 29 147 36 141 40 C128 44 100 43 90 38 C88 36 87 33 88 30Z',
        FOOT = 'M130 40 C134 33 148 34 152 40 C153 44 134 45 130 40Z',
        TAIL = 'M142 27 C148 21 155 23 153 29 C151 33 146 31 143 31Z',
        HEAD = 'M72 18 C80 14 91 19 91 28 C91 36 82 38 74 36 C66 37 53 36 50 30 C48 24 56 21 63 22 C66 21 69 19 72 18Z',
        EAR = 'M80 24 C90 22 94 34 90 46 C86 50 80 46 79 38 C78 32 78 27 80 24Z',
        NOSE = circ(50.5, 27.5, 4.6),
        HAT = 'M69 18 C73 9 82 3 91 6 C89 11 91 16 92 20 C85 16 76 16 69 18Z',
        BRIM = 'M67 19 C74 15 86 14 93 20 C86 18 74 19 67 21Z',
        BIRD = circ(120, 17, 5), BEAK = 'M115 16 L110 17.5 L115 19Z',
        BUCKET = 'M158 98 L182 98 L178 136 L162 136 Z',
        HEART = heart(28, 46, 1);

  return {
    title: 'Snoopy Navideño',
    sky: ['#0f2a5c', '#4a7fc1'],
    particles: 'snow',
    sk: [
      'M36 76 L100 36 L164 76', 'M50 76 V136 H150 V76',
      'M86 31 a30 13 0 1 0 60 0 a30 13 0 1 0 -60 0', circ(80, 27, 12),
      'M44 28 a14 7 0 1 0 28 0 a14 7 0 1 0 -28 0', 'M80 10 V46 M44 28 H100',
      'M80 22 Q94 30 88 50', 'M156 96 L184 96 L180 138 L160 138Z',
      'M0 134 C60 126 140 140 200 132', circ(170, 28, 12), 'M10 44 Q28 30 46 44 Q28 62 10 44'
    ].map(P),
    ink: [
      [GROUND, 1.2, K], [ROOF, 2.2, K], [BODY, 2, K], [DOOR, 1.8, K],
      ['M50 94 H150 M50 110 H150 M50 126 H150', 0.6, '#7f1d1d'],
      [SB, 1.7, K], [FOOT, 1.5, K], [TAIL, 1.5, K], [HEAD, 1.8, K], [EAR, 1.6, K], [NOSE, 1.2, K],
      [circ(74, 23, 1.8), 1, K], ['M70 19 Q74 17 78 19', 1, K], ['M56 33 Q64 38 72 34', 1.1, K],
      ['M90 27 C93 31 93 36 91 39', 2.6, '#dc2626'],
      [HAT, 1.6, K], [BRIM, 1.2, K], [circ(91, 5.5, 4), 1.2, K],
      [BIRD, 1.1, K], [BEAK, 0.9, K], [BUCKET, 1.6, K],
      ['M166 98 L167 136 M174 98 L173 136', 0.6, '#9ca3af'],
      [circ(162, 94, 5), 1.1, K], [circ(170, 90, 5), 1.1, K], [circ(178, 94, 5), 1.1, K],
      [circ(170, 28, 12), 1.2, '#92400e'], [HEART, 1.4, '#9f1239'],
      [star(24, 86, 9), 1.2, '#92400e'], [star(178, 80, 7), 1.2, '#92400e']
    ].map(([d, w, c]) => ({ ...P(d), w, c })),
    fill: [
      ['M0 136 C40 128 80 140 120 134 C160 128 180 136 200 132 V150 H0Z', '#eaf4ff'],
      [circ(170, 28, 12), '#fef9c3'], [HEART, '#fb7185'],
      [star(24, 86, 9), '#fde047'], [star(178, 80, 7), '#fde047'],
      [ROOF, '#ef4444'], [BODY, '#dc2626'], [DOOR, '#1c0a0a'], [BUCKET, '#fff'],
      ['M164 98 L170 98 L170.5 136 L165.5 136Z', '#ef4444'],
      ['M175 98 L182 98 L178 136 L175.5 136Z', '#ef4444'],
      [circ(162, 94, 5), '#fef08a'], [circ(170, 90, 5), '#fef08a'], [circ(178, 94, 5), '#fef08a'],
      [SB, '#fff'], [FOOT, '#fff'], [TAIL, '#fff'], [HEAD, '#fff'], [EAR, K], [NOSE, K],
      [circ(74, 23, 1.8), K], [HAT, '#dc2626'], [BRIM, '#fff'], [circ(91, 5.5, 4), '#fff'],
      [BIRD, '#facc15'], [BEAK, '#f97316']
    ].map(([d, c]) => ({ ...P(d), c, len: 1 })),
    sh: [
      ['M50 76 H150 V86 H50Z', 'rgba(0,0,0,.35)'],
      ['M128 86 H150 V136 H128Z', 'rgba(0,0,0,.18)'],
      ['M92 38 C110 46 130 46 142 40 L141 44 C124 50 104 49 92 41Z', 'rgba(30,41,59,.3)'],
      ['M92 24 C104 22 120 21 132 25 C120 25 104 26 92 29Z', 'rgba(255,255,255,.25)'],
      ['M40 74 L99 39 L99 41 L44 74Z', 'rgba(255,255,255,.35)'],
      ['M0 134 C40 126 80 138 120 132 C160 126 180 134 200 130 V132 C180 138 160 130 120 136Z', 'rgba(148,163,184,.4)']
    ].map(([d, c]) => ({ ...P(d), c, len: 1 }))
  };
})();

// --- PÁGINA 2: Snoopy Aviador ---
const P2 = (() => {
  const ROOF = 'M48 92 L100 58 L152 92 Z',
        BODY = 'M60 92 V136 H140 V92 Z',
        DOOR = 'M86 136 V118 C86 105 114 105 114 118 V136 Z',
        CLOUD_L = 'M10 126 C8 115 22 110 30 116 C36 108 52 108 58 116 C68 114 74 122 70 130 C64 136 16 136 10 126Z',

    fill: c => [[BODY, '#ffffff'], [SHIRT, c], [HEAD, '#ffffff'], [EAR, K], [NOSE, K]]
  };

const xf = (d, s, tx, ty) => d.replace(/([A-Za-z])([^A-Za-z]*)/g, (_, c, a) => {
  if (c === 'Z' || c === 'z') return c;
  const n = (a.match(/-?\d*\.?\d+/g) || []).map(Number), f = v => +v.toFixed(2);
  let o;
  if (c === 'H') o = n.map(v => f(v * s + tx));
  else if (c === 'V') o = n.map(v => f(v * s + ty));
  else if (c === 'a') o = n.map((v, i) => [2, 3, 4].includes(i % 7) ? v : f(v * s));
  else o = n.map((v, i) => f(v * s + (i % 2 ? ty : tx)));
  return c + o.join(' ');
});
const build = (title, sky, particles, sk, ink, fill, sh, shirt, k = { s: 1, tx: 0, ty: 0 }, top = [[], []]) => {
  const m = d => (k.s === 1 && !k.tx && !k.ty) ? d : xf(d, k.s, k.tx, k.ty);
  return {
    title, sky, particles,
    sk: [...sk, ...SN.sk.map(m)].map(P),
    ink: [...ink, ...SN.ink.map(([d, w, c]) => [m(d), w * Math.max(.7, k.s + .2), c]), ...top[1]].map(([d, w, c]) => ({ ...P(d), w, c })),

};

// ============================================================================
// MOTOR DE TEXTURAS DE PINCELES (ACUARELA, CRAYOLA, GIS, TINTA, LÁPIZ, BORRADOR)
// ============================================================================
function hash2d(x, y, seed) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + seed * 37.719) * 43758.5453;
  return n - Math.floor(n);
}

function drawSmoothPath(targetCtx, pts, width) {
  if (pts.length === 1) {
    targetCtx.beginPath();
    targetCtx.arc(pts[0].x, pts[0].y, width / 2, 0, Math.PI * 2);
    targetCtx.fill();
  } else {
    targetCtx.beginPath();
    targetCtx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      targetCtx.lineTo(pts[i].x, pts[i].y);
    }
    targetCtx.stroke();
  }
}

function renderStrokeTo(targetCtx, s) {
  if (!s.pts.length) return;
  targetCtx.save();

  if (s.tool === 'eraser') {
    targetCtx.globalCompositeOperation = 'destination-out';
    targetCtx.strokeStyle = '#000';
    targetCtx.fillStyle = '#000';
    targetCtx.lineWidth = s.r * 1.25;
    drawSmoothPath(targetCtx, s.pts, s.r * 1.25);
    targetCtx.restore();
    return;
  }

  targetCtx.globalCompositeOperation = 'source-over';
  targetCtx.strokeStyle = s.c;
  targetCtx.fillStyle = s.c;

  if (s.tool === 'ink') {
    targetCtx.globalAlpha = 1;
    targetCtx.lineWidth = s.r;
    drawSmoothPath(targetCtx, s.pts, s.r);
  } else if (s.tool === 'brush') {
    targetCtx.globalAlpha = 0.55;
    targetCtx.shadowColor = s.c;
    targetCtx.shadowBlur = s.r * 0.25;
    targetCtx.lineWidth = s.r;
    drawSmoothPath(targetCtx, s.pts, s.r);
  } else if (s.tool === 'pencil') {
    targetCtx.globalAlpha = 0.65;
    const w = Math.max(0.8, s.r * 0.35);
    targetCtx.lineWidth = w;
    drawSmoothPath(targetCtx, s.pts, w);
    targetCtx.globalAlpha = 0.3;
    targetCtx.translate(0.35, -0.35);
    drawSmoothPath(targetCtx, s.pts, w * 0.8);
  } else if (s.tool === 'crayon') {
    targetCtx.globalAlpha = 0.78;
    targetCtx.lineWidth = s.r * 0.85;
    drawSmoothPath(targetCtx, s.pts, s.r * 0.85);
    const step = Math.max(0.8, s.r * 0.25);
    const radius = s.r * 0.55;
    for (let i = 0; i < s.pts.length; i++) {
      const p0 = s.pts[i];
      const p1 = s.pts[Math.min(i + 1, s.pts.length - 1)];
      const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      const count = Math.max(1, Math.ceil(dist / step));
      for (let k = 0; k < count; k++) {
        const t = k / count;
        const cx = p0.x + (p1.x - p0.x) * t;
        const cy = p0.y + (p1.y - p0.y) * t;
        for (let g = 0; g < 6; g++) {
          const r1 = hash2d(cx, cy, g + 1);
          const r2 = hash2d(cy, cx, g + 11);
          const ang = r1 * Math.PI * 2;
          const rad = Math.sqrt(r2) * radius;
          const gx = cx + Math.cos(ang) * rad;
          const gy = cy + Math.sin(ang) * rad;
          targetCtx.globalAlpha = 0.45 + r1 * 0.45;
          targetCtx.fillRect(gx, gy, 0.55, 0.55);
        }
      }
    }
  } else if (s.tool === 'chalk') {
    const step = Math.max(0.6, s.r * 0.2);
    const radius = s.r * 0.65;
    for (let i = 0; i < s.pts.length; i++) {
      const p0 = s.pts[i];
      const p1 = s.pts[Math.min(i + 1, s.pts.length - 1)];
      const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      const count = Math.max(1, Math.ceil(dist / step));
      for (let k = 0; k < count; k++) {
        const t = k / count;
        const cx = p0.x + (p1.x - p0.x) * t;
        const cy = p0.y + (p1.y - p0.y) * t;
        for (let g = 0; g < 12; g++) {
          const r1 = hash2d(cx, cy, g * 3 + 2);
          const r2 = hash2d(cy, cx, g * 5 + 7);
          const ang = r1 * Math.PI * 2;
          const rad = Math.sqrt(r2) * radius;
          const gx = cx + Math.cos(ang) * rad;
          const gy = cy + Math.sin(ang) * rad;
          targetCtx.globalAlpha = 0.14 + r1 * 0.22;
          targetCtx.beginPath();
          targetCtx.arc(gx, gy, 0.35 + r2 * 0.45, 0, Math.PI * 2);
          targetCtx.fill();
        }
      }
    }
  }

  targetCtx.restore();
}

function redrawPaint(pIdx = currentView - 1) {
  pctx.save();
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  pctx.clearRect(0, 0, paint.width, paint.height);
  pctx.restore();
  if (pIdx < 0 || pIdx >= PAGES.length) return;
  for (const s of pageStrokes[pIdx]) {
    renderStrokeTo(pctx, s);
  }
}

// ============================================================================
// INTERACCIÓN DE DIBUJO Y GESTOS DE DESLIZAMIENTO PARA PASAR PÁGINA
// ============================================================================
let swipeStart = null;

function getPt(e) {
  const r = cv.getBoundingClientRect();
  const d = devicePixelRatio || 1;
  return {
    x: ((e.clientX - r.left) * d - fit.ox) / fit.s,
    y: ((e.clientY - r.top) * d - fit.oy) / fit.s
  };
}

cv.addEventListener('pointerdown', e => {
  if (flipState.active) return;

  // En portada: registrar clic o inicio de deslizamiento
  if (currentView === 0) {
    swipeStart = { x: e.clientX, y: e.clientY, time: performance.now() };
    return;
  }

  const pIdx = currentView - 1;
  if (pageModes[pIdx] === 'user') {
    const pt = getPt(e);
    if (pt.x < 0 || pt.x > W || pt.y < 0 || pt.y > H) return;
    cv.setPointerCapture(e.pointerId);
    curStroke = { tool: curTool, c: curColor, r: curSize, pts: [pt] };
    pageStrokes[pIdx].push(curStroke);
    redrawPaint(pIdx);
  } else {
    // Permitir deslizar para cambiar de página cuando no se está pintando
    swipeStart = { x: e.clientX, y: e.clientY, time: performance.now() };
  }
});

cv.addEventListener('pointermove', e => {
  if (!curStroke) return;
  curStroke.pts.push(getPt(e));
  redrawPaint(currentView - 1);
});

const endPointer = e => {
  curStroke = null;
  if (swipeStart && e.clientX !== undefined) {
    const dx = e.clientX - swipeStart.x;
    const dy = e.clientY - swipeStart.y;
    const dt = performance.now() - swipeStart.time;
    swipeStart = null;

    if (currentView === 0) {
      // Tap rápido en portada o deslizamiento hacia la izquierda abre el libro
      if (Math.hypot(dx, dy) < 14 && dt < 450) {
        goToView(1);
      } else if (dx < -45 && Math.abs(dx) > Math.abs(dy)) {
        goToView(1);
      }
    } else if (!flipState.active && Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 500) {
      if (dx < 0 && currentView < PAGES.length) {
        goToView(currentView + 1);
      } else if (dx > 0 && currentView > 0) {
        goToView(currentView - 1);
      }
    }
  }
};
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

function drawBookCover(targetCtx, now) {

  targetCtx.shadowColor = 'transparent';

  // Líneas de páginas en el canto derecho

  targetCtx.beginPath();

function renderAtmosphereTo(targetCtx, type, now, alpha) {
  targetCtx.save();
  targetCtx.globalAlpha = alpha;
  if (type === 'snow') {
    targetCtx.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = 0; i < 40; i++) {
      const x = (i * 47.3 + Math.sin(now / 1000 * 0.8 + i) * 6) % W;
      const y = (now / 1000 * (8 + i % 5 * 3) + i * 29) % H;
      targetCtx.beginPath();
      targetCtx.arc(x, y, 0.7 + i % 3 * 0.3, 0, Math.PI * 2);
      targetCtx.fill();
    }
  } else if (type === 'stars') {
    for (let i = 0; i < 28; i++) {
      const x = (i * 53.7) % W;
      const y = (i * 31.3) % (H * 0.75);
      const twinkle = 0.4 + 0.6 * Math.sin(now / 400 + i * 1.7);
      targetCtx.fillStyle = `rgba(254, 249, 195, ${twinkle})`;
      targetCtx.beginPath();
      targetCtx.arc(x, y, 0.6 + (i % 2) * 0.4, 0, Math.PI * 2);
      targetCtx.fill();
    }
  } else if (type === 'petals') {
    const cols = ['rgba(251,113,133,.75)', 'rgba(253,224,71,.8)', 'rgba(244,114,182,.75)'];
    for (let i = 0; i < 22; i++) {
      const x = (i * 43.1 + Math.sin(now / 1200 + i) * 10 + W) % W;
      const y = (now / 1000 * (6 + i % 4 * 2) + i * 37) % H;
      targetCtx.fillStyle = cols[i % cols.length];
      targetCtx.beginPath();
      targetCtx.ellipse(x, y, 1.3, 0.7, now / 800 + i, 0, Math.PI * 2);
      targetCtx.fill();
    }
  } else if (type === 'notes') {
    targetCtx.font = '8px serif';
    const syms = ['♪', '♫', '♩', '♬'];
    for (let i = 0; i < 14; i++) {
      const x = (25 + i * 13 + Math.sin(now / 700 + i) * 4) % (W - 20);
      const y = (H - ((now / 1000 * (10 + i % 3 * 4) + i * 23) % (H - 15)));
      targetCtx.fillStyle = i % 2 ? 'rgba(253,224,71,.85)' : 'rgba(244,114,182,.85)';
      targetCtx.fillText(syms[i % syms.length], x, y);
    }
  } else if (type === 'hearts') {
    targetCtx.font = '7px serif';
    for (let i = 0; i < 16; i++) {
      const x = (15 + i * 12 + Math.sin(now / 900 + i) * 5) % (W - 15);
      const y = (H - ((now / 1000 * (8 + i % 4 * 3) + i * 19) % (H - 10)));
      targetCtx.fillStyle = i % 2 ? 'rgba(244,63,94,.75)' : 'rgba(251,113,133,.8)';
      targetCtx.fillText('♥', x, y);
    }
  }
  targetCtx.restore();
}

function seq(a, sp) {
  const tot = a.reduce((x, i) => x + i.len, 0);
  let c = 0;
  return a.map(i => {
    const u = cl((sp * tot - c) / i.len);
    c += i.len;
    return u;
  });
}

function lineTo(targetCtx, it, u, w, col, al) {
  if (u <= 0) return;
  targetCtx.save();
  targetCtx.globalAlpha = al;
  targetCtx.strokeStyle = col;
  targetCtx.lineWidth = w;
  targetCtx.lineCap = targetCtx.lineJoin = 'round';
  targetCtx.setLineDash(u >= 1 ? [] : [it.len, it.len + 2]);
  targetCtx.lineDashOffset = it.len * (1 - u);
  targetCtx.stroke(it.p);
  targetCtx.restore();
}

function wipeTo(targetCtx, it, u, col) {
  if (u <= 0) return;
  targetCtx.save();
  targetCtx.beginPath();
  targetCtx.rect(0, 0, W * u, H);
  targetCtx.clip();
  targetCtx.fillStyle = col;
  targetCtx.fill(it.p);
  targetCtx.restore();
}

// Dibuja una página ilustrada completa (con encuadernación lateral, papel crema, arte y sombra de lomo)
function drawBookPage(targetCtx, pIdx, now, options = {}) {
  const page = PAGES[pIdx];
  const pMode = options.forceMode || pageModes[pIdx];
  const td = options.forceFull ? 99 : (now - tDraw) / 1000;
  const sp0 = pMode === 'drawing' ? cl(td / D_DRAW[0]) : 1;
  const sp1 = pMode === 'drawing' ? cl((td - D_DRAW[0]) / D_DRAW[1]) : 1;

  let sp2 = 0, sp3 = 0;
  if (pMode === 'auto') {
    const ta = options.forceFull ? 99 : (now - tAuto) / 1000;
    sp2 = cl(ta / D_AUTO[0]);
    sp3 = cl((ta - D_AUTO[0]) / D_AUTO[1]);
  }

  targetCtx.save();

  // Cubierta de respaldo ligeramente visible en los bordes del libro abierto
  targetCtx.shadowColor = 'rgba(0,0,0,.65)';
  targetCtx.shadowBlur = 24;
  targetCtx.fillStyle = '#6b0b26';
  targetCtx.beginPath();
  targetCtx.roundRect(-3, -2.5, W + 6, H + 5, 5);
  targetCtx.fill();
  targetCtx.shadowColor = 'transparent';

  // Borde de hojas apiladas a la derecha
  targetCtx.fillStyle = '#e7dfd1';
  targetCtx.fillRect(W - 1, 1, 2.5, H - 2);

  // Hoja de papel crema
  targetCtx.fillStyle = '#f7f1e3';
  targetCtx.fillRect(0, 0, W, H);

  targetCtx.save();
  targetCtx.beginPath();
  targetCtx.rect(0, 0, W, H);
  targetCtx.clip();

  if (pMode === 'auto') {
    if (sp2 > 0) {
      const g = targetCtx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, page.sky[0]);
      g.addColorStop(1, page.sky[1]);
      targetCtx.globalAlpha = cl(sp2 * 5);
      targetCtx.fillStyle = g;
      targetCtx.fillRect(0, 0, W, H);
      targetCtx.globalAlpha = 1;
    }
    seq(page.fill, sp2).forEach((u, i) => wipeTo(targetCtx, page.fill[i], u, page.fill[i].c));
  } else {
    // Pintura manual de esta página
    if (options.useDirectStrokes) {
      for (const s of pageStrokes[pIdx]) {
        renderStrokeTo(targetCtx, s);
      }
    } else {
      targetCtx.drawImage(paint, 0, 0, W, H);
    }
  }

  // Boceto a lápiz
  const ska = sp1 > 0 ? Math.max(0, 0.75 - sp1 * 1.2) : 0.75;
  if (ska > 0) {
    const us = seq(page.sk, sp0);
    [[0.5, -0.4], [-0.4, 0.5]].forEach(([dx, dy], k) => {
      targetCtx.save();
      targetCtx.translate(dx, dy);
      page.sk.forEach((it, i) => lineTo(targetCtx, it, cl(us[i] * (k ? 0.95 : 1)), 0.55, '#64748b', ska));
      targetCtx.restore();
    });
  }

  // Tinta
  const ui = seq(page.ink, sp1);
  page.ink.forEach((it, i) => lineTo(targetCtx, it, ui[i], it.w, it.c, 1));

  // Luces, sombras y partículas en modo automático
  if (pMode === 'auto') {
    seq(page.sh, sp3).forEach((u, i) => wipeTo(targetCtx, page.sh[i], u, page.sh[i].c));
    if (sp3 > 0) {
      const v = targetCtx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95);
      v.addColorStop(0, 'rgba(0,0,0,0)');
      v.addColorStop(1, 'rgba(0,0,0,.38)');
      targetCtx.globalAlpha = sp3;
      targetCtx.fillStyle = v;
      targetCtx.fillRect(0, 0, W, H);
      targetCtx.globalAlpha = 1;
      renderAtmosphereTo(targetCtx, page.particles, now, sp3);
    }
  }

  // Sombra realista del pliegue / lomo interior izquierdo del libro
  const crease = targetCtx.createLinearGradient(0, 0, 14, 0);
  crease.addColorStop(0, 'rgba(28, 19, 17, 0.28)');
  crease.addColorStop(0.35, 'rgba(28, 19, 17, 0.08)');
  crease.addColorStop(1, 'rgba(28, 19, 17, 0)');
  targetCtx.fillStyle = crease;
  targetCtx.fillRect(0, 0, 14, H);

  // Número de página discreto en la esquina inferior derecha
  targetCtx.fillStyle = pMode === 'auto' && sp2 > 0.5 ? 'rgba(255,255,255,0.75)' : 'rgba(100,116,139,0.7)';
  targetCtx.font = '600 5.5px Inter, sans-serif';
  targetCtx.textAlign = 'right';
  targetCtx.fillText(`${pIdx + 1}`, W - 5, H - 4);

  targetCtx.restore();
  targetCtx.restore();

  return { sp0, sp1, sp2, sp3 };
}

// ============================================================================
// CAPTURA DE INSTANTÁNEA Y ANIMACIÓN 3D DE CAMBIO DE HOJA (PAGE FLIP)
// ============================================================================
function captureViewToCanvas(targetCanvas, viewIndex, now) {
  targetCanvas.width = cv.width;
  targetCanvas.height = cv.height;
  const tctx = targetCanvas.getContext('2d');
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
  const { s, ox, oy } = fit;
  tctx.setTransform(s, 0, 0, s, ox, oy);

  if (viewIndex === 0) {
    drawBookCover(tctx, now);
  } else {
    drawBookPage(tctx, viewIndex - 1, now, { useDirectStrokes: true });
  }
}

function renderPageFlip3D(progress) {
  // Curva suave easeInOutCubic
  const t = progress < 0.5
    ? 4 * progress * progress * progress
    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

  const { s, ox, oy } = fit;
  const pageX = ox;
  const pageY = oy;
  const pageW = W * s;
  const pageH = H * s;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);

  if (flipState.dir === 1) {
    // AVANZAR: La nueva página está debajo; la página actual gira de derecha a izquierda sobre el lomo
    ctx.drawImage(snapTo, 0, 0);

    // Sombra proyectada sobre la página inferior que se va descubriendo
    ctx.save();
    ctx.fillStyle = `rgba(0, 0, 0, ${(1 - t) * 0.42})`;
    ctx.fillRect(pageX, pageY, pageW * (1 - t * 0.7), pageH);
    ctx.restore();

    // Hoja girando en perspectiva 3D
    const scaleX = Math.cos(t * Math.PI); // +1 -> 0 -> -1
    const lift = Math.sin(t * Math.PI) * (pageH * 0.045);

    ctx.save();
    ctx.translate(pageX, pageY);
    ctx.scale(Math.abs(scaleX), 1);

    if (scaleX >= 0) {
      // Primera mitad del giro: se ve el anverso de la hoja actual encogiéndose hacia el lomo
      ctx.drawImage(
        snapFrom,
        pageX, pageY, pageW, pageH,
        0, -lift * 0.3, pageW, pageH + lift * 0.3
      );
      // Brillo y sombreado curvo en el borde que se levanta
      const grad = ctx.createLinearGradient(0, 0, pageW, 0);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.75, `rgba(255,255,255,${Math.sin(t * Math.PI) * 0.25})`);
      grad.addColorStop(1, `rgba(0,0,0,${Math.sin(t * Math.PI) * 0.35})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, -lift * 0.3, pageW, pageH + lift * 0.3);
    } else {
      // Segunda mitad del giro: se ve el reverso crema de la hoja terminando de asentarse
      const revGrad = ctx.createLinearGradient(0, 0, pageW, 0);
      revGrad.addColorStop(0, '#e5dccb');
      revGrad.addColorStop(0.85, '#f7f1e3');
      revGrad.addColorStop(1, '#dfd4c0');
      ctx.fillStyle = revGrad;
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 18;
      ctx.fillRect(0, -lift * 0.3, pageW, pageH + lift * 0.3);
    }
    ctx.restore();
  } else {
    // RETROCEDER: La página actual está debajo y la página anterior regresa desde el lomo
    ctx.drawImage(snapFrom, 0, 0);

    const scaleX = Math.cos((1 - t) * Math.PI);
    const lift = Math.sin(t * Math.PI) * (pageH * 0.045);

    ctx.save();
    ctx.fillStyle = `rgba(0, 0, 0, ${t * 0.38})`;
    ctx.fillRect(pageX, pageY, pageW * (t * 0.85), pageH);
    ctx.restore();

    ctx.save();
    ctx.translate(pageX, pageY);
    ctx.scale(Math.abs(scaleX), 1);

    if (scaleX < 0) {
      const revGrad = ctx.createLinearGradient(0, 0, pageW, 0);
      revGrad.addColorStop(0, '#e5dccb');
      revGrad.addColorStop(1, '#f7f1e3');
      ctx.fillStyle = revGrad;
      ctx.fillRect(0, -lift * 0.3, pageW, pageH + lift * 0.3);
    } else {
      ctx.drawImage(
        snapTo,
        pageX, pageY, pageW, pageH,
        0, -lift * 0.3, pageW, pageH + lift * 0.3
      );
      const grad = ctx.createLinearGradient(0, 0, pageW, 0);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, `rgba(0,0,0,${Math.sin(t * Math.PI) * 0.3})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, -lift * 0.3, pageW, pageH + lift * 0.3);
    }
    ctx.restore();
  }
}

// ============================================================================
// NAVEGACIÓN ENTRE PORTADA Y PÁGINAS + CONTROLES DE MODO
// ============================================================================
const D_DRAW = [5.0, 8.5];
const D_AUTO = [7.0, 4.2];

function updateUIForCurrentView() {
  const isCover = currentView === 0;
  document.getElementById('goCover').disabled = isCover;
  document.getElementById('prevPage').disabled = isCover;
  document.getElementById('nextPage').disabled = currentView >= PAGES.length;

  document.getElementById('coverControls').style.display = isCover ? 'flex' : 'none';
  document.getElementById('statusHeader').style.opacity = isCover ? '0.9' : '1';

  if (isCover) {
    document.getElementById('pageNum').textContent = 'Portada';
    document.getElementById('pageTitle').textContent = 'Edición Especial para Vany';
    document.getElementById('cap').textContent = '✨ Toca el libro o pulsa Abrir para comenzar';
    document.getElementById('bi').style.width = '0%';
    document.getElementById('choice').style.display = 'none';
    document.getElementById('tools').style.display = 'none';
    document.getElementById('autoControls').style.display = 'none';
    document.getElementById('animControls').style.display = 'none';
    cv.style.cursor = 'pointer';
    resize();
    return;
  }

  const pIdx = currentView - 1;
  const m = pageModes[pIdx];
  document.getElementById('pageNum').textContent = `Página ${currentView} de ${PAGES.length}`;
  document.getElementById('pageTitle').textContent = PAGES[pIdx].title;

  document.getElementById('choice').style.display = m === 'choosing' ? 'flex' : 'none';
  document.getElementById('tools').style.display = m === 'user' ? 'flex' : 'none';
  document.getElementById('autoControls').style.display = (m === 'auto' && autoFin) ? 'flex' : 'none';

  const showSkip = m === 'drawing' || (m === 'auto' && !autoFin);
  document.getElementById('animControls').style.display = showSkip ? 'flex' : 'none';
  cv.style.cursor = m === 'user' ? 'crosshair' : 'default';
  resize();
}

function setMode(m) {
  if (currentView === 0) return;
  const pIdx = currentView - 1;
  pageModes[pIdx] = m;

  if (m === 'auto') {
    tAuto = performance.now();
    autoFin = false;
  } else if (m === 'drawing') {
    tDraw = performance.now();
    autoFin = false;
  }
  updateUIForCurrentView();
}

function goToView(targetView) {
  if (targetView < 0 || targetView > PAGES.length || targetView === currentView || flipState.active) return;

  const now = performance.now();
  const dir = targetView > currentView ? 1 : -1;

  // Capturar la vista actual antes de cambiar
  captureViewToCanvas(snapFrom, currentView, now);

  // Actualizar índice y preparar lienzo de la nueva vista
  currentView = targetView;
  curStroke = null;
  if (currentView > 0) {
    const pIdx = currentView - 1;
    redrawPaint(pIdx);
    if (pageModes[pIdx] === 'drawing') {
      tDraw = now;
    } else if (pageModes[pIdx] === 'auto') {
      tAuto = now - (D_AUTO[0] + D_AUTO[1] + 1) * 1000;
      autoFin = true;
    }
  }

  // Capturar la vista destino para la animación de hoja
  captureViewToCanvas(snapTo, currentView, now);

  flipState = {
    active: true,
    dir,
    start: now,
    dur: 620
  };

  playPageFlipSound();
  updateUIForCurrentView();
}

document.getElementById('openBookBtn').onclick = () => goToView(1);
document.getElementById('goCover').onclick = () => goToView(0);
document.getElementById('prevPage').onclick = () => goToView(currentView - 1);
document.getElementById('nextPage').onclick = () => goToView(currentView + 1);

// Botón "Saltar animación"
document.getElementById('skipAnim').onclick = () => {
  if (currentView === 0) return;
  const pIdx = currentView - 1;
  const m = pageModes[pIdx];
  if (m === 'drawing') {
    tDraw = performance.now() - (D_DRAW[0] + D_DRAW[1] + 1) * 1000;
    setMode('choosing');
  } else if (m === 'auto') {
    tAuto = performance.now() - (D_AUTO[0] + D_AUTO[1] + 1) * 1000;
  }
};

document.getElementById('chooseUser').onclick = () => setMode('user');
document.getElementById('chooseAuto').onclick = () => setMode('auto');
document.getElementById('switchAuto').onclick = () => setMode('auto');
document.getElementById('switchUser').onclick = () => setMode('user');
document.getElementById('undo').onclick = () => {
  if (currentView === 0) return;
  pageStrokes[currentView - 1].pop();
  redrawPaint(currentView - 1);
};
document.getElementById('clear').onclick = () => {
  if (currentView === 0) return;
  pageStrokes[currentView - 1] = [];
  redrawPaint(currentView - 1);
};
document.getElementById('replay1').onclick = () => setMode('drawing');
document.getElementById('replay2').onclick = () => setMode('drawing');

function exportCurrentPage() {
  if (currentView === 0) return;
  const pIdx = currentView - 1;
  const page = PAGES[pIdx];
  const m = pageModes[pIdx];

  const out = document.createElement('canvas');
  out.width = W * SCALE;
  out.height = H * SCALE;
  const octx = out.getContext('2d');

  octx.fillStyle = '#f7f1e3';
  octx.fillRect(0, 0, out.width, out.height);

  if (m === 'auto') {
    octx.save();
    octx.scale(SCALE, SCALE);
    const g = octx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, page.sky[0]);
    g.addColorStop(1, page.sky[1]);
    octx.fillStyle = g;
    octx.fillRect(0, 0, W, H);
    page.fill.forEach(it => { octx.fillStyle = it.c; octx.fill(it.p); });
    page.ink.forEach(it => {
      octx.strokeStyle = it.c; octx.lineWidth = it.w;
      octx.lineCap = octx.lineJoin = 'round'; octx.stroke(it.p);
    });
    page.sh.forEach(it => { octx.fillStyle = it.c; octx.fill(it.p); });
    octx.restore();
  } else {
    octx.drawImage(paint, 0, 0);
    octx.save();
    octx.scale(SCALE, SCALE);
    page.ink.forEach(it => {
      octx.strokeStyle = it.c; octx.lineWidth = it.w;
      octx.lineCap = octx.lineJoin = 'round'; octx.stroke(it.p);
    });
    octx.restore();
  }

  out.toBlob(async b => {
    const name = `snoopy-pag${currentView}-vany.png`;
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare) {
      const f = new File([b], name, { type: 'image/png' });
      if (navigator.canShare({ files: [f] })) {
        try { await navigator.share({ files: [f], title: 'Snoopy para Vany' }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}

// Atajos de teclado (laptop) y vibración ligera (teléfono)
addEventListener('keydown', e => {
  const $b = id => document.getElementById(id);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    const u = $b('undo'); if (u && u.offsetParent) { u.click(); e.preventDefault(); } return;
  }
  const id = { ArrowRight: 'nextPage', ArrowLeft: 'prevPage', Home: 'goCover' }[e.key];
  const b = id && $b(id); if (b && !b.disabled) b.click();
});
[['nextPage', 'Página siguiente (→)'], ['prevPage', 'Página anterior (←)'], ['goCover', 'Portada (Inicio)'], ['undo', 'Deshacer (Ctrl+Z)']]
  .forEach(([id, t]) => { const b = document.getElementById(id); if (b) b.title = t; });
document.addEventListener('click', e => { if (e.target.closest('button') && navigator.vibrate) navigator.vibrate(8); });

document.getElementById('save').onclick = exportCurrentPage;
document.getElementById('saveAuto').onclick = exportCurrentPage;

// ============================================================================
// BUCLE PRINCIPAL DE ANIMACIÓN Y RENDERIZADO
// ============================================================================
function resize() {
  const d = devicePixelRatio || 1;
  const b = cv.getBoundingClientRect();
  cv.width = b.width * d;
  cv.height = b.height * d;
  const s = Math.min(cv.width / (W + 18), cv.height / (H + 16));
  fit = { s, ox: (cv.width - W * s) / 2, oy: (cv.height - H * s) / 2 };
}

function frame(now) {
  requestAnimationFrame(frame);

  // Si hay una transición 3D de hoja pasando en curso
  if (flipState.active) {
    const p = cl((now - flipState.start) / flipState.dur);
    renderPageFlip3D(p);
    if (p >= 1) {
      flipState.active = false;
      if (currentView > 0 && pageModes[currentView - 1] === 'drawing') {
        tDraw = performance.now();
      }
    }
    return;
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const { s, ox, oy } = fit;
  ctx.setTransform(s, 0, 0, s, ox, oy);

  // Vista 0: Portada del Libro
  if (currentView === 0) {
    drawBookCover(ctx, now);
    return;
  }

  // Vistas 1..7: Páginas ilustradas
  const pIdx = currentView - 1;
  const page = PAGES[pIdx];
  const m = pageModes[pIdx];
  const { sp0, sp1, sp2, sp3 } = drawBookPage(ctx, pIdx, now);

  if (m === 'drawing' && sp1 >= 1) {
    setMode('choosing');
  }

  const cap = document.getElementById('cap');
  const bi = document.getElementById('bi');
  const td = (now - tDraw) / 1000;

  if (m === 'drawing') {
    const st = sp0 < 1 ? 0 : 1;
    const arr = st ? page.ink : page.sk;
    const u = seq(arr, st ? sp1 : sp0);
    const i = u.findIndex(v => v < 1);
    const it = arr[Math.max(0, i)];
    const pt = it.e.getPointAtLength(it.len * (i < 0 ? 1 : u[i]));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.font = `${Math.max(22, s * 12)}px serif`;
    ctx.textBaseline = 'bottom';
    ctx.fillText(st ? '🖋️' : '✏️', ox + pt.x * s - 2, oy + pt.y * s + 3);
    cap.textContent = st ? '2 · Entintado' : '1 · Boceto a lápiz';
    bi.style.width = Math.min(100, td / (D_DRAW[0] + D_DRAW[1]) * 100) + '%';
  } else if (m === 'choosing') {
    cap.textContent = '✨ ¡Listo! ¿Cómo quieres colorearlo?';
    bi.style.width = '100%';
  } else if (m === 'user') {
    cap.textContent = '🎨 ¡Tu turno de colorear!';
    bi.style.width = '100%';
  } else if (m === 'auto') {
    if (sp3 < 1) {
      const p = sp2 < 1 ? sp2 : sp3;
      const x = p * W;
      const y = H * 0.55 + Math.sin(now / 1000 * 6) * 8;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.font = `${Math.max(22, s * 12)}px serif`;
      ctx.textBaseline = 'bottom';
      ctx.fillText('🖌️', ox + x * s - 2, oy + y * s + 3);
      cap.textContent = sp2 < 1 ? '3 · Color mágico' : '4 · Luces y sombras';
      bi.style.width = Math.min(100, ((now - tAuto) / 1000) / (D_AUTO[0] + D_AUTO[1]) * 100) + '%';
    } else {
      cap.textContent = '✨ Terminado';
      bi.style.width = '100%';
      if (!autoFin) {
        autoFin = true;
        document.getElementById('animControls').style.display = 'none';
        document.getElementById('autoControls').style.display = 'flex';
        resize();
        celebrar();
      }
    }
  }
}

function celebrar() {
  for (let k = 0; k < 14; k++) {
    setTimeout(() => {
      const e = document.createElement('span');
      e.className = 'h';
      e.textContent = ['💖', '✨', '🐾', '🎨'][k % 4];
      e.style.left = Math.random() * 95 + 'vw';
      e.style.animationDuration = (3 + Math.random() * 2) + 's';
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 5500);
    }, k * 160);
  }
}

addEventListener('resize', resize);
updateUIForCurrentView();
requestAnimationFrame(frame);
</script>
