<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Snoopy · para Vany</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,#3b3b47,#1c1c24);color:#e5e7eb;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));overflow:hidden;user-select:none}
#cap{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:#fcd34d;margin:2px 0 6px;text-align:center}
#bar{width:min(92vw,560px);height:4px;background:#ffffff22;border-radius:9px;overflow:hidden;margin-bottom:8px}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f43f5e,#facc15);transition:width .15s linear}
#wrap{flex:1;width:100%;max-width:820px;min-height:0;margin-bottom:10px;position:relative}
canvas{width:100%;height:100%;display:block;touch-action:none}
#choice,#tools,#autoControls{display:none;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:600px;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.choice-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.big-btn{font:inherit;font-size:.98rem;font-weight:600;border-radius:999px;padding:11px 22px;cursor:pointer;border:0;transition:transform .15s,box-shadow .15s}
.big-btn:active{transform:scale(.96)}
.btn-user{background:linear-gradient(135deg,#fb7185,#f43f5e);color:#fff;box-shadow:0 4px 16px #f43f5e55}
.btn-auto{background:#fcd34d;color:#1f2937;box-shadow:0 4px 16px #fcd34d44}
#pal{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;background:#ffffff12;padding:7px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #ffffff44;cursor:pointer;transition:transform .15s,border-color .15s}
.sw.act{transform:scale(1.22);border-color:#fff;box-shadow:0 0 10px #ffffff88}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center}
.sz{width:26px;height:26px;border-radius:50%;background:#ffffff18;border:1.5px solid transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.sz span{background:#e5e7eb;border-radius:50%;display:block}
.sz.act{border-color:#fcd34d;background:#ffffff30}
button.btn{font:inherit;font-size:.82rem;background:#ffffff1a;border:1px solid #ffffff26;border-radius:999px;padding:7px 14px;color:#f3f4f6;cursor:pointer;font-weight:500}
button.btn:active{transform:scale(.96)}
button.pri{background:#fcd34d;color:#1f2937;border:0;font-weight:600}
.h{position:fixed;bottom:-30px;font-size:24px;pointer-events:none;animation:up 4s ease-in forwards}
@keyframes up{to{transform:translateY(-105vh) rotate(20deg);opacity:0}}
</style>
</head>
<body>
<div id="cap">1 · Boceto a lápiz</div><div id="bar"><i id="bi"></i></div>
<div id="wrap"><canvas id="cv"></canvas></div>

<!-- Elección al terminar el entintado -->
<div id="choice">
  <div class="choice-row">
    <button class="big-btn btn-user" id="chooseUser">🎨 Lo pinto yo</button>
    <button class="big-btn btn-auto" id="chooseAuto">✨ Píntalo solo</button>
  </div>
</div>

<!-- Herramientas si elige pintarlo ella -->
<div id="tools">
  <div id="pal"></div>
  <div class="row">
    <button class="sz" data-r="3" title="Pincel fino"><span style="width:5px;height:5px"></span></button>
    <button class="sz act" data-r="7" title="Pincel medio"><span style="width:10px;height:10px"></span></button>
    <button class="sz" data-r="14" title="Pincel grueso"><span style="width:16px;height:16px"></span></button>
    <button class="btn" id="undo">↩ Deshacer</button>
    <button class="btn" id="clear">🧹 Limpiar</button>
    <button class="btn" id="switchAuto">✨ Mejor píntalo solo</button>
    <button class="btn" id="replay1">🔄 Redibujar</button>
    <button class="btn pri" id="save">💾 Guardar</button>
  </div>
</div>

<!-- Controles cuando termina de pintarse solo -->
<div id="autoControls">
  <div class="row">
    <button class="btn" id="switchUser">🎨 Quiero pintarlo yo</button>
    <button class="btn pri" id="replay2">🔄 Ver de nuevo</button>
  </div>
</div>

<script>
const NS='http://www.w3.org/2000/svg',W=200,H=150,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const svg=document.createElementNS(NS,'svg');svg.style.cssText='position:absolute;width:0;height:0;visibility:hidden';document.body.appendChild(svg);
const P=d=>{const e=document.createElementNS(NS,'path');e.setAttribute('d',d);svg.appendChild(e);return{e,p:new Path2D(d),len:e.getTotalLength()||1}};
const cl=x=>Math.max(0,Math.min(1,x));
const circ=(x,y,r)=>`M${x-r} ${y} a${r} ${r} 0 1 0 ${2*r} 0 a${r} ${r} 0 1 0 ${-2*r} 0Z`;

const ROOF='M36 76 L100 36 L164 76 Z',BODY='M50 76 V136 H150 V76 Z',DOOR='M82 136 V118 C82 100 118 100 118 118 V136 Z',GROUND='M0 136 C40 128 80 140 120 134 C160 128 180 136 200 132';
const SB='M88 30 C90 20 120 18 134 25 C143 29 147 36 141 40 C128 44 100 43 90 38 C88 36 87 33 88 30Z',
FOOT='M130 40 C134 33 148 34 152 40 C153 44 134 45 130 40Z',TAIL='M142 27 C148 21 155 23 153 29 C151 33 146 31 143 31Z',
HEAD='M72 18 C80 14 91 19 91 28 C91 36 82 38 74 36 C66 37 53 36 50 30 C48 24 56 21 63 22 C66 21 69 19 72 18Z',
EAR='M80 24 C90 22 94 34 90 46 C86 50 80 46 79 38 C78 32 78 27 80 24Z',NOSE=circ(50.5,27.5,4.6),
HAT='M69 18 C73 9 82 3 91 6 C89 11 91 16 92 20 C85 16 76 16 69 18Z',BRIM='M67 19 C74 15 86 14 93 20 C86 18 74 19 67 21Z',
BIRD=circ(120,17,5),BEAK='M115 16 L110 17.5 L115 19Z',BUCKET='M158 98 L182 98 L178 136 L162 136 Z',
HEART='M28 46 C28 40 20 38 20 44 C20 50 28 54 28 58 C28 54 36 50 36 44 C36 38 28 40 28 46Z',
STAR=(x,y,R)=>{let d='';for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?R*.45:R;d+=(i?'L':'M')+(x+Math.cos(a)*q).toFixed(1)+' '+(y+Math.sin(a)*q).toFixed(1)}return d+'Z'};

// 1) Boceto
const SK=['M36 76 L100 36 L164 76','M50 76 V136 H150 V76','M86 31 a30 13 0 1 0 60 0 a30 13 0 1 0 -60 0',circ(80,27,12),'M44 28 a14 7 0 1 0 28 0 a14 7 0 1 0 -28 0','M80 10 V46 M44 28 H100','M80 22 Q94 30 88 50','M156 96 L184 96 L180 138 L160 138Z','M0 134 C60 126 140 140 200 132',circ(170,28,12),'M10 44 Q28 30 46 44 Q28 62 10 44'].map(P);

// 2) Tinta
const K='#111827';
const INK=[[GROUND,1.2,K],[ROOF,2.2,K],[BODY,2,K],[DOOR,1.8,K],['M50 94 H150 M50 110 H150 M50 126 H150',.6,'#7f1d1d'],
[SB,1.7,K],[FOOT,1.5,K],[TAIL,1.5,K],[HEAD,1.8,K],[EAR,1.6,K],[NOSE,1.2,K],[circ(74,23,1.8),1,K],['M70 19 Q74 17 78 19',1,K],['M56 33 Q64 38 72 34',1.1,K],['M90 27 C93 31 93 36 91 39',2.6,'#dc2626'],
[HAT,1.6,K],[BRIM,1.2,K],[circ(91,5.5,4),1.2,K],[BIRD,1.1,K],[BEAK,.9,K],[BUCKET,1.6,K],['M166 98 L167 136 M174 98 L173 136',.6,'#9ca3af'],[circ(162,94,5),1.1,K],[circ(170,90,5),1.1,K],[circ(178,94,5),1.1,K],
[circ(170,28,12),1.2,'#92400e'],[HEART,1.4,'#9f1239'],[STAR(24,86,9),1.2,'#92400e'],[STAR(178,80,7),1.2,'#92400e']].map(([d,w,c])=>({...P(d),w,c}));

// 3) Color automático
const FILL=[['M0 136 C40 128 80 140 120 134 C160 128 180 136 200 132 V150 H0Z','#eaf4ff'],[circ(170,28,12),'#fef9c3'],[HEART,'#fb7185'],[STAR(24,86,9),'#fde047'],[STAR(178,80,7),'#fde047'],
[ROOF,'#ef4444'],[BODY,'#dc2626'],[DOOR,'#1c0a0a'],[BUCKET,'#fff'],['M164 98 L170 98 L170.5 136 L165.5 136Z','#ef4444'],['M175 98 L182 98 L178 136 L175.5 136Z','#ef4444'],[circ(162,94,5),'#fef08a'],[circ(170,90,5),'#fef08a'],[circ(178,94,5),'#fef08a'],
[SB,'#fff'],[FOOT,'#fff'],[TAIL,'#fff'],[HEAD,'#fff'],[EAR,K],[NOSE,K],[circ(74,23,1.8),K],[HAT,'#dc2626'],[BRIM,'#fff'],[circ(91,5.5,4),'#fff'],[BIRD,'#facc15'],[BEAK,'#f97316']].map(([d,c])=>({...P(d),c,len:1}));

// 4) Luces y sombras automáticas
const SH=[['M50 76 H150 V86 H50Z','rgba(0,0,0,.35)'],['M128 86 H150 V136 H128Z','rgba(0,0,0,.18)'],['M92 38 C110 46 130 46 142 40 L141 44 C124 50 104 49 92 41Z','rgba(30,41,59,.3)'],['M92 24 C104 22 120 21 132 25 C120 25 104 26 92 29Z','rgba(255,255,255,.25)'],['M40 74 L99 39 L99 41 L44 74Z','rgba(255,255,255,.35)'],['M0 134 C40 126 80 138 120 132 C160 126 180 134 200 130 V132 C180 138 160 130 120 136Z','rgba(148,163,184,.4)']].map(([d,c])=>({...P(d),c,len:1}));

// Lienzo oculto para pintura libre
const SCALE=4,paint=document.createElement('canvas');paint.width=W*SCALE;paint.height=H*SCALE;
const pctx=paint.getContext('2d');pctx.scale(SCALE,SCALE);pctx.lineCap=pctx.lineJoin='round';

// Estados: 'drawing' -> 'choosing' -> 'user' | 'auto'
let mode='drawing',tDraw=performance.now(),tAuto=0,autoFin=false;
let curColor='#ef4444',curSize=7,strokes=[],curStroke=null,fit={s:1,ox:0,oy:0};

const COLORS=['#ef4444','#fb7185','#f97316','#facc15','#fef08a','#4ade80','#38bdf8','#1e3a8a','#c084fc','#ffffff','#111827','eraser'];
const palEl=document.getElementById('pal');
COLORS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='sw'+(i===0?' act':'');
  if(c==='eraser'){b.textContent='🧽';b.style.cssText='background:#374151;display:grid;place-items:center;font-size:13px;padding:0';b.title='Borrador'}
  else b.style.background=c;
  b.onclick=()=>{document.querySelectorAll('.sw').forEach(x=>x.classList.remove('act'));b.classList.add('act');curColor=c};
  palEl.appendChild(b);
});

document.querySelectorAll('.sz').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.sz').forEach(x=>x.classList.remove('act'));b.classList.add('act');curSize=+b.dataset.r;
});

function redrawPaint(){
  pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,paint.width,paint.height);pctx.restore();
  for(const s of strokes){
    pctx.save();
    pctx.globalCompositeOperation=s.c==='eraser'?'destination-out':'source-over';
    pctx.strokeStyle=s.c==='eraser'?'#000':s.c;
    pctx.fillStyle=pctx.strokeStyle;
    pctx.lineWidth=s.r;
    if(s.pts.length===1){pctx.beginPath();pctx.arc(s.pts[0].x,s.pts[0].y,s.r/2,0,Math.PI*2);pctx.fill()}
    else{pctx.beginPath();pctx.moveTo(s.pts[0].x,s.pts[0].y);for(let i=1;i<s.pts.length;i++)pctx.lineTo(s.pts[i].x,s.pts[i].y);pctx.stroke()}
    pctx.restore();
  }
}

function getPt(e){
  const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;
  return{x:((e.clientX-r.left)*d-fit.ox)/fit.s,y:((e.clientY-r.top)*d-fit.oy)/fit.s};
}

cv.addEventListener('pointerdown',e=>{
  if(mode!=='user')return;
  const pt=getPt(e);if(pt.x<0||pt.x>W||pt.y<0||pt.y>H)return;
  cv.setPointerCapture(e.pointerId);
  curStroke={c:curColor,r:curSize,pts:[pt]};
  strokes.push(curStroke);
  redrawPaint();
});
cv.addEventListener('pointermove',e=>{
  if(!curStroke)return;
  curStroke.pts.push(getPt(e));
  redrawPaint();
});
const endStroke=()=>{curStroke=null};
cv.addEventListener('pointerup',endStroke);
cv.addEventListener('pointercancel',endStroke);

function setMode(m){
  mode=m;
  document.getElementById('choice').style.display=m==='choosing'?'flex':'none';
  document.getElementById('tools').style.display=m==='user'?'flex':'none';
  document.getElementById('autoControls').style.display='none';
  cv.style.cursor=m==='user'?'crosshair':'default';
  if(m==='auto'){tAuto=performance.now();autoFin=false}
  if(m==='drawing'){tDraw=performance.now()}
  resize();
}

document.getElementById('chooseUser').onclick=()=>setMode('user');
document.getElementById('chooseAuto').onclick=()=>setMode('auto');
document.getElementById('switchAuto').onclick=()=>setMode('auto');
document.getElementById('switchUser').onclick=()=>setMode('user');
document.getElementById('undo').onclick=()=>{strokes.pop();redrawPaint()};
document.getElementById('clear').onclick=()=>{strokes=[];redrawPaint()};
document.getElementById('replay1').onclick=()=>setMode('drawing');
document.getElementById('replay2').onclick=()=>setMode('drawing');

document.getElementById('save').onclick=()=>{
  const out=document.createElement('canvas');out.width=W*SCALE;out.height=H*SCALE;
  const octx=out.getContext('2d');
  octx.fillStyle='#f7f1e3';octx.fillRect(0,0,out.width,out.height);
  octx.drawImage(paint,0,0);
  octx.scale(SCALE,SCALE);
  INK.forEach(it=>{octx.strokeStyle=it.c;octx.lineWidth=it.w;octx.lineCap=octx.lineJoin='round';octx.stroke(it.p)});
  const a=document.createElement('a');a.download='snoopy-vany.png';a.href=out.toDataURL('image/png');a.click();
};

const D_DRAW=[6,10],D_AUTO=[8,5];
function resize(){const d=devicePixelRatio||1,b=cv.getBoundingClientRect();cv.width=b.width*d;cv.height=b.height*d;const s=Math.min(cv.width/(W+16),cv.height/(H+16));fit={s,ox:(cv.width-W*s)/2,oy:(cv.height-H*s)/2}}
function seq(a,sp){const tot=a.reduce((x,i)=>x+i.len,0);let c=0;return a.map(i=>{const u=cl((sp*tot-c)/i.len);c+=i.len;return u})}
function line(it,u,w,col,al){if(u<=0)return;ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap=ctx.lineJoin='round';ctx.setLineDash(u>=1?[]:[it.len,it.len+2]);ctx.lineDashOffset=it.len*(1-u);ctx.stroke(it.p);ctx.restore()}
function wipe(it,u,col){if(u<=0)return;ctx.save();ctx.beginPath();ctx.rect(0,0,W*u,H);ctx.clip();ctx.fillStyle=col;ctx.fill(it.p);ctx.restore()}

function frame(now){
  requestAnimationFrame(frame);
  const td=(now-tDraw)/1000;
  const sp0=cl(td/D_DRAW[0]),sp1=cl((td-D_DRAW[0])/D_DRAW[1]);

  if(mode==='drawing'&&sp1>=1)setMode('choosing');

  let sp2=0,sp3=0;
  if(mode==='auto'){
    const ta=(now-tAuto)/1000;
    sp2=cl(ta/D_AUTO[0]);
    sp3=cl((ta-D_AUTO[0])/D_AUTO[1]);
  }

  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  const{s,ox,oy}=fit;ctx.setTransform(s,0,0,s,ox,oy);

  // Hoja
  ctx.save();ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=28;ctx.fillStyle='#f7f1e3';ctx.fillRect(0,0,W,H);ctx.restore();
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();

  if(mode==='auto'){
    // Color automático
    if(sp2>0){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f2a5c');g.addColorStop(1,'#4a7fc1');ctx.globalAlpha=cl(sp2*5);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
    seq(FILL,sp2).forEach((u,i)=>wipe(FILL[i],u,FILL[i].c));
  }else{
    // Pintura manual de Vany
    ctx.drawImage(paint,0,0,W,H);
  }

  // Boceto (se borra al entintar)
  const ska=sp1>0?Math.max(0,.75-sp1*1.2):.75;
  if(ska>0){
    const us=seq(SK,sp0);
    [[.5,-.4],[-.4,.5]].forEach(([dx,dy],k)=>{ctx.save();ctx.translate(dx,dy);SK.forEach((it,i)=>line(it,cl(us[i]*(k?.95:1)),.55,'#64748b',ska));ctx.restore()});
  }

  // Tinta
  const ui=seq(INK,sp1);
  INK.forEach((it,i)=>line(it,ui[i],it.w,it.c,1));

  // Luces, sombras y nieve en modo automático
  if(mode==='auto'){
    seq(SH,sp3).forEach((u,i)=>wipe(SH[i],u,SH[i].c));
    if(sp3>0){
      const v=ctx.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.4)');ctx.globalAlpha=sp3;ctx.fillStyle=v;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
      ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<40;i++){const x=(i*47.3+Math.sin(now/1000*.8+i)*6)%W,y=(now/1000*(8+i%5*3)+i*29)%H;ctx.beginPath();ctx.arc(x,y,.7+i%3*.3,0,7);ctx.fill()}
    }
  }

  ctx.restore();

  // Herramientas animadas y textos de estado
  const cap=document.getElementById('cap'),bi=document.getElementById('bi');
  if(mode==='drawing'){
    const st=sp0<1?0:1,arr=st?INK:SK,u=seq(arr,st?sp1:sp0),i=u.findIndex(v=>v<1);
    const it=arr[Math.max(0,i)],pt=it.e.getPointAtLength(it.len*(i<0?1:u[i]));
    ctx.setTransform(1,0,0,1,0,0);ctx.font=`${Math.max(22,s*12)}px serif`;ctx.textBaseline='bottom';
    ctx.fillText(st?'🖋️':'✏️',ox+pt.x*s-2,oy+pt.y*s+3);
    cap.textContent=st?'2 · Entintado':'1 · Boceto a lápiz';
    bi.style.width=Math.min(100,td/(D_DRAW[0]+D_DRAW[1])*100)+'%';
  }else if(mode==='choosing'){
    cap.textContent='✨ ¡Listo! ¿Cómo quieres colorearlo?';
    bi.style.width='100%';
  }else if(mode==='user'){
    cap.textContent='🎨 ¡Tu turno de colorear!';
    bi.style.width='100%';
  }else if(mode==='auto'){
    if(sp3<1){
      const p=sp2<1?sp2:sp3,x=p*W,y=H*.55+Math.sin(now/1000*6)*8;
      ctx.setTransform(1,0,0,1,0,0);ctx.font=`${Math.max(22,s*12)}px serif`;ctx.textBaseline='bottom';
      ctx.fillText('🖌️',ox+x*s-2,oy+y*s+3);
      cap.textContent=sp2<1?'3 · Color':'4 · Luces y sombras';
      bi.style.width=Math.min(100,((now-tAuto)/1000)/(D_AUTO[0]+D_AUTO[1])*100)+'%';
    }else{
      cap.textContent='✨ Terminado';
      bi.style.width='100%';
      if(!autoFin){autoFin=true;document.getElementById('autoControls').style.display='flex';resize();celebrar()}
    }
  }
}

function celebrar(){
  for(let k=0;k<14;k++)setTimeout(()=>{
    const e=document.createElement('span');e.className='h';
    e.textContent=['💖','✨','🐾','🎨'][k%4];
    e.style.left=Math.random()*95+'vw';e.style.animationDuration=(3+Math.random()*2)+'s';
    document.body.appendChild(e);setTimeout(()=>e.remove(),5500);
  },k*160);
}

addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script>
</body>
</html>
